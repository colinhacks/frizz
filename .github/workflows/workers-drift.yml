name: workers-drift

# The alarm for the frizz.sh Workers. Every 30 minutes it reads what Cloudflare is running and FAILS
# when anything there did not come from workers-deploy.yml — and GitHub emails a failed scheduled
# run. The rules, and why each holds, are in the header of scripts/workers-drift.mjs.
#
# It needs no install: the check is one zero-dependency script on Node's own fetch.
#
# Two GitHub behaviours to know. Notifications for a scheduled run go to whoever last changed this
# file's cron line, so whoever edits it inherits the alarm. And GitHub turns a schedule off after 60
# days without repository activity on a public repo; a run that never happens fails nothing, so if
# this repo goes quiet, check that the workflow is still enabled.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # read the deploy run a Worker's version names, with its approvals and steps

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.x"

      # CLOUDFLARE_READ_TOKEN can only read; a repository secret, not the deploy environment's, so
      # this job never waits for an approval and never holds anything that can deploy.
      # WORKERS_CI_AUTHOR is a repository VARIABLE (not a secret): the ids of the deploy tokens CI has
      # uploaded with, which cloudflare-tokens.mjs adds to as it mints each one. Unset, every run fails
      # and prints the author it saw.
      # CLOUDFLARE_CLAIMS_READ reads the name registry and nothing else: see the script's header.
      - name: Check that everything the Workers run came from CI
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_CLAIMS_READ: ${{ secrets.CLOUDFLARE_CLAIMS_READ }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKERS_CI_AUTHOR: ${{ vars.WORKERS_CI_AUTHOR }}
        run: node scripts/workers-drift.mjs
