<!doctype html>
<!-- Source for img/og.png (1200x630). Not deployed (see .vercelignore). Regenerate with:
     node scripts/shot.mjs http://127.0.0.1:8765/og.html site/img/og.png "" --w=1200 --h=630 --dsf=1 --wait=1500
     with `python3 -m http.server 8765 --directory site` running. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/site.css" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
      .og { display: grid; grid-template-columns: 200px 1fr; gap: 60px; align-items: center; height: 630px; padding: 0 84px 0 92px; }
      .og img { width: 200px; height: 200px; filter: drop-shadow(0 10px 18px rgba(70, 50, 15, 0.22)) drop-shadow(0 28px 40px rgba(70, 50, 15, 0.16)); }
      .og h1 { margin: 0; font-size: 62px; line-height: 1.04; font-weight: 720; letter-spacing: -0.05em; color: var(--ink); }
      .og p { margin: 26px 0 0; font-size: 26px; line-height: 1.4; color: var(--ink-2); letter-spacing: -0.012em; }
      .og .install { margin-top: 34px; height: 60px; padding: 0 30px; font-size: 23px; }
    </style>
  </head>
  <body>
    <div class="og">
      <img src="/img/fff-tile.png" alt="" />
      <div>
        <h1>The agent console for<br />extreme productivity.</h1>
        <p>A web app for running many Claude&nbsp;Code and Codex agents.</p>
        <code class="install"><span class="dollar">$</span><span class="cmd">npx frizz</span></code>
      </div>
    </div>
  </body>
</html>
