<!doctype html>
<!-- Source for img/og.png (1200x630). Not deployed (see .vercelignore). Regenerate with:
     node scripts/shot.mjs http://127.0.0.1:8765/og.html site/img/og.png "" --w=1200 --h=630 --dsf=1 --wait=1500
     with `python3 -m http.server 8765 --directory site` running. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/site.css" />
    <style>
      /* The homepage's first screen on a card: its headline, swash and pill, with the name above them. */
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
      .og { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 630px; text-align: center; }
      .og-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; font-size: 38px; line-height: 1; font-weight: 650; letter-spacing: -0.025em; }
      .og-brand img { width: 60px; height: 60px; }
      .og h1 { margin: 0; font-size: 112px; line-height: 1.06; font-weight: 720; letter-spacing: -0.05em; }
      .og .install { margin-top: 44px; padding: 0 34px; font-size: 28px; box-shadow: none; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="swashInk" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#eabe2c"/><stop offset="1" stop-color="#e2ad1f"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="og">
      <div class="og-brand"><img src="/img/fff-mark.svg?v=1b5b5878" alt="" /><span>Frizz</span></div>
      <h1>The <span class="swashed"><span>agent console</span><svg class="swash" viewBox="0 0 400 44" preserveAspectRatio="none" aria-hidden="true"><path d="M6 30 C 70 22, 150 17, 236 16.5 C 300 16, 352 18, 394 23" fill="none" stroke="url(#swashInk)" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></span> for<br />extreme productivity.</h1>
      <div class="install"><span class="dollar">$</span><code class="cmd">npx frizz</code></div>
    </div>
  </body>
</html>
