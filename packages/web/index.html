<!doctype html>
<html lang="en" data-font="sans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pre-hydration only: App.tsx replaces this with "owner/repo | Frizz" once the board arrives. -->
    <title>Frizz</title>
    <!-- Own Dock/tab identity. The SVG favicon is preferred by modern browsers; the PNGs are the
         fallback + the source Chrome rasterizes into the macOS app icon when the app is installed
         ("Install frizz…" / Create Shortcut → Open as window), which is the only way a Chrome-hosted
         window gets its own Dock name+icon (a plain --app window is owned by Chrome). -->
    <!-- ?v= is a cache-buster: Chrome caches favicons per-URL for a long time, so an icon EDIT at the
         same path keeps showing the stale cached copy (a hard-quit doesn't clear it). Bump this whenever
         the icon art changes so the browser refetches. v6: fff — the cursive f written three times. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0e10" />
    <!-- FLASH GUARD, and it is about NAVIGATION rather than first run. Switching projects from the
         rail is a real document load (each board binds its own socket, board store and API base to
         one project, so a full load is how all three get re-bound in one step) — and the browser
         paints its default canvas for the frame before the module CSS arrives. That default is WHITE,
         so every project switch strobed. Resolve this browser's appearance before paint; the inline
         canvas rules need no stylesheet, with an OS fallback if JavaScript is unavailable. -->
    <meta name="color-scheme" content="dark light" />
    <style>
      html, body { background: #0d0e10; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f7f7f7; }
      @media (prefers-color-scheme: light) { html:not([data-theme]), html:not([data-theme]) body { background: #f7f7f7; } }
    </style>
    <script>
      let frizzThemePreference
      try { frizzThemePreference = localStorage.getItem("frizz-theme") } catch {}
      let frizzSystemDark = false
      try { frizzSystemDark = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches } catch {}
      const frizzTheme = frizzThemePreference === "dark" || frizzThemePreference === "light" ? frizzThemePreference : frizzSystemDark ? "dark" : "light"
      document.documentElement.dataset.theme = frizzTheme
      document.documentElement.style.colorScheme = frizzTheme
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", frizzTheme === "dark" ? "#0d0e10" : "#f7f7f7")
    </script>
    <!-- THE NAVIGATION GATE. `frizzNavigate` is the only way this page reloads itself or sends itself
         somewhere: lib/navigation.ts is the app's way in, and navigation.guard.test.ts fails on any
         other. A move the browser sees no fresh click or keypress behind (`navigator.userActivation`) is
         counted, per tab, and past five in a minute or twelve in half an hour the page stops and offers a
         Reload button instead of going. Nothing clears that count but time and a click; above all not a
         successful boot, which is how a board on frizz.sh reloaded itself every two seconds for as long
         as it was open (2026-11-18). The launcher's recovery page counts on the same key
         (supervisor-pages.ts), so the two cannot pass a loop back and forth.

         THE BOOT WATCHDOG. A boot script or stylesheet that fails to load (a board's answer cut by the
         relay, a 504) left a blank page that nothing retried, and a board opened from a phone's home
         screen has no reload button: only killing the app brought it back. So a failed entry module or
         preload before main.tsx has run, or a failed stylesheet before the page has loaded, puts up a
         line saying so and loads the page again through the gate, on a backoff and when it comes back
         into view. Lazy chunks are not its business: main.tsx sets `frizzBooted` once it runs, and
         lib/lazyModule retries those. Only the board's own files count: Cloudflare injected its
         analytics beacon into every page served through frizz.sh, as a module script from another
         origin that the page's script policy refuses, and that refusal is not a failed boot. -->
    <script>
      ;(() => {
        const LEDGER = "frizz-auto-navigations"
        const counted = (now) => {
          let list = []
          try { list = JSON.parse(sessionStorage.getItem(LEDGER) || "[]") } catch {}
          return Array.isArray(list) ? list.filter((at) => typeof at === "number" && at <= now && now - at < 1800000) : []
        }
        const keep = (list) => { try { sessionStorage.setItem(LEDGER, JSON.stringify(list)) } catch {} }
        const go = (to, replace) => (to === null ? location.reload() : replace ? location.replace(to) : location.assign(to))
        // The one move nothing counts: the human pressed the button.
        const reloadByHand = () => { keep([]); location.reload() }

        // Covers the page, whatever has booted under it. Its layer is LAYER.pageStopped in lib/layers.ts.
        let panel = null
        const show = (text, label) => {
          const draw = () => {
            if (!panel) {
              const light = document.documentElement.dataset.theme === "light"
              panel = document.createElement("div")
              panel.setAttribute("data-frizz-stopped", "")
              panel.style.cssText = "position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px;font:15px/1.5 system-ui,-apple-system,sans-serif;background:" + (light ? "#f7f7f7;color:#1a1b1e" : "#0d0e10;color:#e6e7ea")
              const box = document.createElement("div")
              box.style.maxWidth = "28rem"
              const line = document.createElement("p")
              line.style.margin = "0 0 12px"
              const button = document.createElement("button")
              button.type = "button"
              // 5px over 7px: on even padding the label's cap band sat 0.75px low in the box (ink-align.mjs, 2026-11-18).
              button.style.cssText = "font:inherit;font-size:14px;padding:5px 14px 7px;border-radius:6px;border:1px solid;background:none;color:inherit"
              button.addEventListener("click", reloadByHand)
              box.append(line, button)
              panel.append(box)
              document.body.append(panel)
            }
            panel.querySelector("p").textContent = text
            panel.querySelector("button").textContent = label
          }
          if (document.body) draw()
          else addEventListener("DOMContentLoaded", draw)
        }

        window.frizzNavigate = (to, { replace = false, reason }) => {
          const now = Date.now()
          if (navigator.userActivation?.isActive) {
            keep([])
            go(to, replace)
            return true
          }
          const list = counted(now)
          if (list.length >= 12 || list.filter((at) => now - at < 60000).length >= 5) {
            console.warn(`Frizz stopped this page ${to === null ? "reloading" : `moving to ${to}`} by itself (${reason}): ${list.length} automatic loads in the last 30m.`)
            show("Frizz stopped reloading this page by itself.", "Reload")
            return false
          }
          list.push(now)
          keep(list)
          go(to, replace)
          return true
        }

        addEventListener("error", (event) => {
          const el = event.target
          if (!el || el === window || window.frizzBootFailed) return
          const url = el.src || el.href
          if (typeof url !== "string" || !url.startsWith(location.origin + "/")) return
          const failed =
            (el.tagName === "SCRIPT" && el.type === "module" && !window.frizzBooted) ||
            (el.tagName === "LINK" && el.rel === "modulepreload" && !window.frizzBooted) ||
            (el.tagName === "LINK" && el.rel === "stylesheet" && document.readyState !== "complete")
          if (!failed) return
          window.frizzBootFailed = true
          const key = "frizz-boot-retry"
          let last = null
          try { last = JSON.parse(sessionStorage.getItem(key) || "null") } catch {}
          const now = Date.now()
          const n = last && now - last.at < 120000 ? last.n + 1 : 0
          try { sessionStorage.setItem(key, JSON.stringify({ n, at: now })) } catch {}
          const reload = () => window.frizzNavigate(null, { reason: `the boot watchdog: ${url} failed to load` })
          let timer = n < 12 ? setTimeout(reload, Math.min(30000, 1000 * 2 ** n) * (0.75 + Math.random() / 2)) : 0
          addEventListener("online", reload)
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState !== "visible") return
            clearTimeout(timer)
            timer = setTimeout(reload, 300)
          })
          show("Frizz didn't finish loading. This page tries again on its own.", "Try again")
        }, true)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
