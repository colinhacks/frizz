name = "frizz-registrar"
main = "src/worker.ts"
compatibility_date = "2026-08-24"

# The Frizz account, not the personal one. Without this a non-interactive `wrangler deploy` fails with
# "More than one account available but unable to select one" — a machine with several accounts cannot
# guess, and CI has nobody to ask. An account id is not a secret; the API token is, and that stays out.
account_id = "dde3ec1f6b1f0a397ea82a9ed322f5ce"

# The registrar runs during signup and never again — it is NOT on the data plane. A board that is
# already running keeps working whether or not this Worker is up, and protecting that property is
# worth more than any other choice in this package.

# Daily sweep of lapsed leases. Without it the 200-record and 1,000-tunnel caps fill with names
# nobody uses any more, and new signups stop for a reason nothing points at.
# AN EXPLICIT ROUTE, NOT JUST A CUSTOM DOMAIN.
#
# The relay owns `*.frizz.sh/*`, and a WORKERS ROUTE BEATS A CUSTOM DOMAIN — so once the relay shipped,
# the wildcard swallowed registrar.frizz.sh and signup started answering "No Frizz board has claimed
# this name." A more specific route wins over the wildcard and puts this back. Both are declared: the
# custom domain provisions the hostname, the route decides who serves it.
[[routes]]
pattern = "registrar.frizz.sh"
custom_domain = true

[[routes]]
pattern = "registrar.frizz.sh/*"
zone_name = "frizz.sh"

[triggers]
crons = ["17 4 * * *"]

[vars]
FRIZZ_ZONE = "frizz.sh"

# A claim body carries a GitHub token. Off in the file, so a dashboard toggle cannot quietly start
# recording requests; workers-drift alarms if it is ever on.
[observability]
enabled = false

# Set with `wrangler secret put`, never here — this file is committed.
#   wrangler secret put CF_API_TOKEN    # Tunnel:Edit + Zone DNS:Edit, and nothing else
#   wrangler secret put CF_ACCOUNT_ID
#   wrangler secret put CF_ZONE_ID

# One small JSON row per claimed name: owner public key, tunnel id, port, and the lease timestamps.
# Recreate with `wrangler kv namespace create CLAIMS` and paste the new id here.
[[kv_namespaces]]
binding = "CLAIMS"
id = "aa4a9c11473d4511a556e3e3a6857058"

# The registry itself (src/claim-db.ts): every claim, the lock that serializes them, the hourly budgets.
# KV above stays a mirror the relay reads. Created by `scripts/cloudflare-tokens.mjs --registrar-db` in a
# deploy sitting on 2026-11-12; workers-drift pins this id.
[[d1_databases]]
binding = "CLAIMS_DB"
database_name = "frizz-registrar-claims"
database_id = "8d67ee04-82f2-416f-855b-6081964df5e6"
